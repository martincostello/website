name: dependency-review

on:
  pull_request:

permissions: {}

jobs:
  dependency-review:
    runs-on: ubuntu-26.04

    permissions:
      contents: read

    steps:

      - name: Harden runner
        uses: step-security/harden-runner@v2.23.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          filter: 'tree:0'
          persist-credentials: false
          show-progress: false

      - name: Review dependencies
        uses: actions/dependency-review-action@v5.0.1
