name: benchmark

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  NUGET_XMLDOC_MODE: skip
  TERM: xterm

on:
  push:
    branches:
      - main
      - dotnet-vnext
      - dotnet-nightly
    paths-ignore:
      - '**/*.gitattributes'
      - '**/*.gitignore'
      - '**/*.md'
  workflow_dispatch:

permissions: {}

jobs:
  benchmark:
    name: benchmark
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      id-token: write

    steps:

    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        filter: 'tree:0'
        persist-credentials: false
        show-progress: false

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6.1.0

    - name: Setup Node
      uses: actions/setup-node@v7.1.0
      with:
        node-version: '26.x'

    - name: Run benchmarks
      shell: pwsh
      run: ./benchmark.ps1

    - name: Publish BenchmarkDotNet artifacts
      uses: actions/upload-artifact@v7.0.2
      if: ${{ !cancelled() }}
      with:
        name: artifacts
        path: ./BenchmarkDotNet.Artifacts/results/*
        if-no-files-found: error

    - name: Get repository name
      id: get-repo-name
      shell: pwsh
      run: |
        $repoName = ${env:GITHUB_REPOSITORY}.Split("/")[-1]
        "repo-name=${repoName}" >> ${env:GITHUB_OUTPUT}

    - name: Get GitHub token
      id: get-github-token
      if: github.event.repository.fork == false
      uses: martincostello/github-automation/actions/get-github-token@get-github-token/v4.3.3
      with:
        profile-name: benchmarks

    - name: Publish results
      uses: martincostello/benchmarkdotnet-results-publisher@v2.1.1
      if: github.event.repository.fork == false
      with:
        branch: ${{ github.ref_name }}
        comment-on-threshold: true
        name: Website
        output-file-path: '${{ steps.get-repo-name.outputs.repo-name }}/data.json'
        repo: '${{ github.repository_owner }}/benchmarks'
        repo-token: ${{ steps.get-github-token.outputs.token }}

    - name: Output summary
      shell: pwsh
      env:
        REPO_NAME: ${{ steps.get-repo-name.outputs.repo-name }}
      run: |
        $summary += "`n`n"
        $summary += "View benchmark results history [here](https://benchmarks.martincostello.com/?repo=${env:REPO_NAME}&branch=${env:GITHUB_REF_NAME})."
        $summary >> ${env:GITHUB_STEP_SUMMARY}
